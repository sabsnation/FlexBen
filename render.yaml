# Blueprint Render — https://render.com/docs/blueprint-spec
# Como usar: dashboard.render.com → New → Blueprint → selecione este repositório.

databases:
  - name: flexben-db
    plan: free
    databaseName: corpbenefit
    user: corp

services:
  - type: web
    name: flexben-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: bash backend/scripts/render-build.sh
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: flexben-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      # ── Auditoria (opcional, escolha um provider) ──
      # AUDIT_PROVIDER: firestore | mongo | noop  (auto-detecta se vazio)
      - key: AUDIT_PROVIDER
        sync: false
      # Firestore — JSON da service account em 1 linha
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # MongoDB Atlas — string de conexão
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      # ── Mensageria (opcional) ──
      # Sem RABBITMQ_URL a API usa modo inline (notificações na hora, sem fila).
      # Com fila: crie instância em https://www.cloudamqp.com (plano free) e cole a URL AMQP.
      - key: RABBITMQ_URL
        sync: false
      # Login Google (mesmo Client ID do VITE_GOOGLE_CLIENT_ID na Vercel)
      - key: GOOGLE_CLIENT_ID
        sync: false
