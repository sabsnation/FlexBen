# Blueprint Render — https://render.com/docs/blueprint-spec
# Deploy: conecte o repositório Git e use "New > Blueprint"

databases:
  - name: flexben-db
    plan: free
    databaseName: corpbenefit
    user: corp

services:
  - type: web
    name: flexben-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flexben-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
