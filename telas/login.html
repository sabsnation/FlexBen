<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Beneficios Corporativos</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card" style="max-width: 460px; margin: 0 auto;">
        <h1>Login</h1>
        <p class="subtitle">Acesse sua conta para consultar saldo e transferir beneficios.</p>

        <div class="grid">
          <div>
            <label for="email">E-mail</label>
            <input id="email" type="email" placeholder="seuemail@empresa.com" />
          </div>
          <div>
            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="********" />
          </div>
        </div>

        <div class="actions">
          <a class="btn" href="./dashboard.html">Entrar</a>
          <a class="btn secondary" href="./cadastro.html">Criar conta</a>
        </div>
      </div>
    </div>
  </body>
  </html>
