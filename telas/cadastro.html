<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - Beneficios Corporativos</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Cadastro de Usuario</h1>
        <p class="subtitle">Primeira versao da tela de onboarding do sistema.</p>

        <div class="grid cols-2">
          <div>
            <label for="nome">Nome completo</label>
            <input id="nome" type="text" placeholder="Digite seu nome" />
          </div>
          <div>
            <label for="cpf">CPF</label>
            <input id="cpf" type="text" placeholder="000.000.000-00" />
          </div>
          <div>
            <label for="email">E-mail corporativo</label>
            <input id="email" type="email" placeholder="nome@empresa.com" />
          </div>
          <div>
            <label for="telefone">Telefone</label>
            <input id="telefone" type="text" placeholder="(00) 00000-0000" />
          </div>
          <div>
            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="********" />
          </div>
          <div>
            <label for="confirmacao">Confirmar senha</label>
            <input id="confirmacao" type="password" placeholder="********" />
          </div>
        </div>

        <div class="actions">
          <a class="btn" href="./login.html">Cadastrar</a>
          <a class="btn secondary" href="./login.html">Voltar para login</a>
        </div>
      </div>
    </div>
  </body>
  </html>
